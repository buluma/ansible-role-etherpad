---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Install sudo if missing
      ansible.builtin.raw: "{{ ansible_pkg_mgr | default('dnf') }} install -y sudo"
      become: false
      changed_when: false
      failed_when: false

    - name: Install python3 if missing
      ansible.builtin.raw: >-
        if [ -x /usr/bin/python3 ]; then exit 0; fi;
        if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y python3;
        elif command -v dnf >/dev/null 2>&1; then dnf install -y python3;
        elif command -v yum >/dev/null 2>&1; then yum install -y python3;
        elif command -v zypper >/dev/null 2>&1; then zypper -n install python3;
        else exit 1; fi
      become: false
      changed_when: false
      failed_when: false

    - name: Configure passwordless sudo
      ansible.builtin.raw: >-
        if ! grep -q '^%wheel ALL=(ALL) NOPASSWD: ALL' /etc/sudoers; then
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers;
        fi;
        visudo -cf /etc/sudoers
      become: false
      changed_when: false
      failed_when: false

  roles:
    - role: buluma.bootstrap
    - role: buluma.core_dependencies
    - role: buluma.epel
    - role: buluma.npm

  post_tasks:
    - name: Install Node.js 24 RPM repository
      ansible.builtin.yum_repository:
        name: nodesource-nodejs-24
        description: Node.js 24 Packages
        baseurl: https://rpm.nodesource.com/pub_24.x/nodistro/nodejs/$basearch
        gpgkey: https://rpm.nodesource.com/pub/el/NODESOURCE-GPG-SIGNING-KEY-EL
        gpgcheck: true
        module_hotfixes: true
      when:
        - ansible_facts['os_family'] == 'RedHat'

    - name: Install current Node.js package
      ansible.builtin.package:
        name: nodejs
        state: latest
      when:
        - ansible_facts['os_family'] == 'RedHat'

    - name: Read the installed Node.js version
      ansible.builtin.command:
        cmd: node --version
      changed_when: false
      register: etherpad_node_version

    - name: Require a Node.js version supported by Etherpad 3
      ansible.builtin.assert:
        that:
          - (etherpad_node_version.stdout | regex_replace('^v', '')) is version('24.0.0', '>=')
